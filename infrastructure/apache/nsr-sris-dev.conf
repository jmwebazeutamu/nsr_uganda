# Apache vhost for nsr-sris-dev.quasar.ug on the shared quasar.ug box.
#
# ONE hostname, TWO containers, path-routed:
#
#   /                       -> public container  (127.0.0.1:8006)
#   /login/ /logout/        -> registry container (127.0.0.1:8005)
#   /home/ /console/ ...    -> registry container
#   /api/ /admin/ /static/  -> registry container
#
# The public site is the front door; staff sign in at /login/ on the same
# host. Both containers run the same image; the public one runs with
# ROOT_URLCONF=nsr_mis.urls_public, whose URLconf contains no registry
# routes at all, so a path that reached it by mistake 404s rather than
# serving anything.
#
# ORDER MATTERS. Apache takes the FIRST matching ProxyPass, so every
# registry prefix must appear before the catch-all "/" at the bottom.
#
# ---------------------------------------------------------------------
# Note on LP-O-10. The spec recommends the public site sit in a network
# zone with no route to the registry. Serving both from one hostname is a
# deliberate step away from that: they now share an origin, so a browser
# holding an operator session cookie would send it on public-page
# requests too. Two things narrow that:
#
#   * `RequestHeader unset Cookie` on the public route below, so session
#     and CSRF cookies never reach the public process at all.
#   * The public process still has no registry routes, so even with a
#     cookie it can serve nothing but the public page.
#
# What is lost is browser-level origin separation: a future XSS on the
# public page would sit on the same origin as the operator MIS. If the
# public site ever carries user-supplied content (news, a grievance form
# with echoed input), move it back to its own hostname. Recorded for the
# security review.
# ---------------------------------------------------------------------
#
# HTTP (:80) only. certbot --apache adds the :443 vhost + the http->https
# redirect at go-live, referencing the cert it provisions — do NOT add a
# :443 block here by hand (a missing SSLCertificateFile fails config-test
# and would break every other site on this Apache). After certbot runs,
# add `RequestHeader set X-Forwarded-Proto "https"` to the generated
# -le-ssl.conf so Django's SECURE_PROXY_SSL_HEADER sees https.
#
# Install:
#   sudo cp infrastructure/apache/nsr-sris-dev.conf /etc/apache2/sites-available/
#   sudo a2ensite nsr-sris-dev && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d nsr-sris-dev.quasar.ug    # after DNS resolves

<VirtualHost *:80>
    ServerName nsr-sris-dev.quasar.ug

    ProxyPreserveHost On

    # --- Registry container (127.0.0.1:8005) --------------------------
    # WhiteNoise inside gunicorn serves /static for BOTH sites: the two
    # containers run the same image, so collectstatic has already put the
    # public site's tokens and font there. /media is never exposed.
    ProxyPass        /static/        http://127.0.0.1:8005/static/
    ProxyPassReverse /static/        http://127.0.0.1:8005/static/
    ProxyPass        /login/         http://127.0.0.1:8005/login/
    ProxyPassReverse /login/         http://127.0.0.1:8005/login/
    ProxyPass        /logout/        http://127.0.0.1:8005/logout/
    ProxyPassReverse /logout/        http://127.0.0.1:8005/logout/
    ProxyPass        /home/          http://127.0.0.1:8005/home/
    ProxyPassReverse /home/          http://127.0.0.1:8005/home/
    ProxyPass        /console/       http://127.0.0.1:8005/console/
    ProxyPassReverse /console/       http://127.0.0.1:8005/console/
    ProxyPass        /admin-console/ http://127.0.0.1:8005/admin-console/
    ProxyPassReverse /admin-console/ http://127.0.0.1:8005/admin-console/
    ProxyPass        /admin/         http://127.0.0.1:8005/admin/
    ProxyPassReverse /admin/         http://127.0.0.1:8005/admin/
    ProxyPass        /api/           http://127.0.0.1:8005/api/
    ProxyPassReverse /api/           http://127.0.0.1:8005/api/
    ProxyPass        /manual/        http://127.0.0.1:8005/manual/
    ProxyPassReverse /manual/        http://127.0.0.1:8005/manual/
    ProxyPass        /healthz        http://127.0.0.1:8005/healthz
    ProxyPassReverse /healthz        http://127.0.0.1:8005/healthz

    # --- Public container (127.0.0.1:8006), catch-all. MUST BE LAST. ---
    # The public process never needs a cookie, and now shares an origin
    # with the operator MIS, so strip them on the way in — an operator's
    # session must never reach it. NOT <Location "/">: that matches every
    # path, including /login/, and would strip the session cookie off the
    # registry requests too. The negative lookahead excludes exactly the
    # prefixes proxied to 8005 above.
    <LocationMatch "^/(?!static/|login/|logout/|home/|console/|admin-console/|admin/|api/|manual/|healthz)">
        RequestHeader unset Cookie
    </LocationMatch>
    ProxyPass        /               http://127.0.0.1:8006/
    ProxyPassReverse /               http://127.0.0.1:8006/

    ErrorLog ${APACHE_LOG_DIR}/nsr-sris-dev_error.log
    CustomLog ${APACHE_LOG_DIR}/nsr-sris-dev_access.log combined
</VirtualHost>
