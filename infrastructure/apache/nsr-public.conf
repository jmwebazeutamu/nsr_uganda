# Apache vhost for the NSR MIS PUBLIC SITE on the shared quasar.ug box.
#
# Separate hostname, separate vhost, separate container from the operator
# MIS. Spec LP-O-10 recommends the public site sit in a zone with no route
# to the registry network; on a single shared box the strongest available
# form of that is a distinct process whose ROOT_URLCONF (nsr_mis.urls_public)
# has no registry routes in it at all, fronted by its own vhost. A real
# separate zone is still the target once hosting is decided.
#
# HTTP (:80) only. certbot --apache adds the :443 vhost + the http->https
# redirect, referencing the cert it provisions — do NOT add a :443 block
# here by hand (a missing SSLCertificateFile fails config-test and would
# break every other site on this Apache). After certbot runs, add
# `RequestHeader set X-Forwarded-Proto "https"` to the generated
# -le-ssl.conf so Django's SECURE_PROXY_SSL_HEADER sees https.
#
# ServerName is a placeholder until LP-O-01 is closed: it is not decided
# whether this site replaces nsr.mglsd.go.ug or runs beside it. Do not
# point a .go.ug name here before that decision and the DPO sign-off on
# the §8.3 disclosure floor (LP-O-06).
#
# Install:
#   sudo cp infrastructure/apache/nsr-public.conf /etc/apache2/sites-available/
#   sudo a2ensite nsr-public && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d nsr-public.quasar.ug    # after DNS resolves

<VirtualHost *:80>
    ServerName nsr-public.quasar.ug

    # WhiteNoise (in gunicorn) serves /static. There is no /media here:
    # the public container serves no user uploads and no personal data.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8006/
    ProxyPassReverse / http://127.0.0.1:8006/

    ErrorLog ${APACHE_LOG_DIR}/nsr-public_error.log
    CustomLog ${APACHE_LOG_DIR}/nsr-public_access.log combined
</VirtualHost>
