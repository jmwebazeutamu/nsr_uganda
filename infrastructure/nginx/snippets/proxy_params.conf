# Shared proxy headers for every upstream location.
#
# X-Forwarded-Proto carries $scheme, which is what Django's
# SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https") reads to
# decide a request was secure. It is therefore what makes secure cookies
# and request.is_secure() correct behind this proxy. $scheme (not a
# hardcoded "https") so the same snippet is correct in the HTTP-only
# Phase 5 config and the TLS Phase 7 config.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Match gunicorn's --timeout=60 so nginx does not give up first and mask
# a slow view as a 504 with no traceback in the app log.
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_redirect off;
