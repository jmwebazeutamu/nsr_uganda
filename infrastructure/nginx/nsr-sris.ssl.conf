# NSR MIS production edge — HTTPS (Phase 7, after certbot has issued).
#
# Server: nsr-sris.mglsd.go.ug (154.72.204.74)
#
# DO NOT make this the active config before the certificate exists:
# nginx fails to start when an ssl_certificate path is missing, which
# would take the whole site down. Activation is a deliberate one-line
# switch of NGINX_CONF in /opt/nsrmis/.env followed by a reload.
#
# TLS settings are written inline rather than `include`-ing certbot's
# options-ssl-nginx.conf, because the webroot plugin (which is what this
# stack uses — it never touches the nginx config) does not reliably
# install that file.

upstream nsr_registry {
    server web:8000;
    keepalive 16;
}

upstream nsr_public {
    server public:8000;
    keepalive 16;
}

# --- :80 — ACME + redirect ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nsr-sris.mglsd.go.ug;

    server_tokens off;

    # The renewal challenge MUST stay on plain HTTP and MUST NOT be
    # redirected — Let's Encrypt follows redirects, but keeping this
    # local removes a whole class of renewal failure. ^~ so it wins over
    # the regex-free catch-all below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Liveness probe stays on plain HTTP, deliberately NOT redirected.
    #
    # Both health checks probe http://127.0.0.1/healthz: the nginx
    # container's own HEALTHCHECK, and the GitHub Actions deploy job on
    # the host. Redirecting it breaks both — busybox wget follows the 301
    # to the public hostname and cannot route there from inside the
    # container ("Host is unreachable"), and curl in the deploy job sees
    # 301 rather than 200 and fails the deploy after 30 retries, even
    # though the deploy itself succeeded. That is exactly what happened on
    # the first automated production deploy.
    #
    # Safe to serve unredirected: /healthz returns a fixed liveness string,
    # no personal data, no session. This is the normal arrangement for
    # load-balancer probes.
    location = /healthz {
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://nsr_registry;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 — the real site ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nsr-sris.mglsd.go.ug;

    ssl_certificate     /etc/letsencrypt/live/nsr-sris.mglsd.go.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsr-sris.mglsd.go.ug/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt stopped publishing an OCSP responder
    # URL in its certificates, so the directive is a no-op that only emits
    # "ssl_stapling ignored, no OCSP responder URL" on every config test.
    # Revocation is handled by short (90-day) certificate lifetimes.

    client_max_body_size 30m;

    access_log /var/log/nginx/nsr-sris_access.log;
    error_log  /var/log/nginx/nsr-sris_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    # --- Security headers (edge-owned) --------------------------------
    # Only headers Django does NOT already set. Django's SecurityMiddleware
    # (enabled by NSR_SECURE_SSL=True) emits X-Content-Type-Options,
    # X-Frame-Options and Referrer-Policy on every app response, and
    # duplicating them here caused a real defect: nginx sent
    # Referrer-Policy "strict-origin-when-cross-origin" while Django sent
    # "same-origin", so the response carried two conflicting values.
    # Django's is the stricter of the two and the right one for a registry
    # holding personal data — it sends no referrer cross-origin at all —
    # so the edge defers to it.
    #
    # HSTS stays here as well as in Django, deliberately: it must appear on
    # responses the app never sees (502 when web is down, the 444 default
    # server, nginx error pages), or a downgrade attack has a window. Both
    # emit an identical value, so there is no conflict.
    #
    # Permissions-Policy is edge-only — Django sets no equivalent.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Keep serving the challenge on TLS too, for a renewal that arrives
    # over an existing redirect chain.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Registry container -------------------------------------------
    location /static/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /login/         { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /logout/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /home/          { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /console/       { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /admin-console/ { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /admin/         { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /api/           { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /manual/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location = /healthz      { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; access_log off; }

    # --- Public site, catch-all (cookies stripped) --------------------
    location / {
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_set_header Cookie "";
        proxy_pass http://nsr_public;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
