# NSR MIS production edge — HTTP ONLY (Phase 5 bring-up).
#
# Server: nsr-sris.mglsd.go.ug (154.72.204.74)
#
# This is the config the stack boots with BEFORE a certificate exists.
# nginx refuses to start if an ssl_certificate file is missing, so the
# TLS server block cannot be present until certbot has issued the cert.
# Phase 7 switches NGINX_CONF in .env to nsr-sris.ssl.conf and reloads.
#
# ONE hostname, TWO upstreams, path-routed — mirrors the Apache vhost
# used on the training box (infrastructure/apache/nsr-sris-dev.conf):
#
#   /                       -> public   (public site, ROOT_URLCONF=urls_public)
#   /login/ /logout/        -> web      (registry)
#   /home/ /console/ ...    -> web
#   /api/ /admin/ /static/  -> web
#
# Unlike Apache, nginx matches the LONGEST prefix, not the first — so the
# order of these blocks is cosmetic, not load-bearing.

upstream nsr_registry {
    server web:8000;
    keepalive 16;
}

upstream nsr_public {
    server public:8000;
    keepalive 16;
}

server {
    # IPv4 only. This host has no IPv6 address and no IPv6 default route,
    # so a `listen [::]` here binds a socket nothing can ever reach — and
    # it becomes actively harmful once IPv6 is disabled at the kernel to
    # stop Docker dialing Docker Hub's unreachable AAAA record: nginx then
    # fails to start with "Address family not supported by protocol" and
    # takes the site down. Restore these only alongside real IPv6 egress.
    listen 80;
    server_name nsr-sris.mglsd.go.ug;

    # Bounded by DATA_UPLOAD_MAX_MEMORY_SIZE (25 MiB of base64 UPD
    # evidence) plus JSON overhead. Django is still the real backstop.
    client_max_body_size 30m;

    access_log /var/log/nginx/nsr-sris_access.log;
    error_log  /var/log/nginx/nsr-sris_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    # --- ACME webroot -------------------------------------------------
    # Present from the first boot so the Phase 7 certificate request has
    # somewhere to drop its challenge. Served straight off disk.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Registry container -------------------------------------------
    # /static/ is served by WhiteNoise INSIDE gunicorn for both sites:
    # the two containers run the same image, so collectstatic has already
    # placed the public site's tokens and self-hosted Inter there.
    # /media is deliberately NOT exposed.
    location /static/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /login/         { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /logout/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /profile/       { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    # Django's password-reset confirmation links. The address goes
    # out by email, so an unrouted prefix here is a 404 in somebody's
    # inbox — and it passes every Django test-client test, because
    # the test client never meets nginx.
    location /reset/         { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /home/          { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /console/       { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /admin-console/ { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /admin/         { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /api/           { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location /manual/        { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; }
    location = /healthz      { include /etc/nginx/snippets/proxy_params.conf; proxy_pass http://nsr_registry; access_log off; }

    # --- Public site, catch-all ---------------------------------------
    # The public process never needs a cookie and shares an origin with
    # the operator MIS, so strip cookies on the way in: an operator's
    # session must never reach it (LP-O-10 mitigation, carried over from
    # the Apache vhost). Because this is `location /`, it only ever
    # matches paths NOT claimed by a longer prefix above — so the
    # registry routes keep their session cookie.
    location / {
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_set_header Cookie "";
        proxy_pass http://nsr_public;
    }
}

# Any request arriving on this IP with a Host we do not serve gets 444
# (close without response) rather than being handed the real site.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
