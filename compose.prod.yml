# NSR MIS — production stack (single-host Docker Compose).
#
# Deploys ALONGSIDE the other services on this shared box (ADR-0027): the
# host's Apache + certbot already own 80/443 and front several sites, so
# this stack does NOT run its own TLS proxy. Instead `web` publishes
# gunicorn on 127.0.0.1:8005 (localhost only) and a host Apache vhost
# (nsr-sris-dev.quasar.ug) reverse-proxies to it with certbot TLS. Static
# is served by WhiteNoise from inside gunicorn (NSR_WHITENOISE=True), so
# Apache only needs to proxy the app.
#
# Core stack: web + Celery worker + beat + Postgres/PostGIS + Redis.
# Keycloak / OpenSearch / MinIO / RabbitMQ are a documented phase 2.
#
#   docker compose -f compose.prod.yml --env-file .env pull   # (CD-built image)
#   docker compose -f compose.prod.yml --env-file .env up -d
#
# db + redis are NEVER published to the host — they live on this project's
# private network only (the box already runs other postgres/redis on
# 5432/6379, and ufw DENYs those externally anyway).

name: nsr-sris-dev

x-app-image: &app_image ${NSR_IMAGE:-ghcr.io/jmwebazeutamu/nsr_uganda:latest}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: *app_image
    restart: unless-stopped
    env_file: [.env]
    entrypoint: ["/usr/local/bin/web-entrypoint.sh"]
    command:
      - gunicorn
      - nsr_mis.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    # Localhost-only publish: the host Apache vhost proxies to this.
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The public site. Same image, its own process, and ROOT_URLCONF pointed
  # at nsr_mis.urls_public so the registry routes do not exist in it at
  # all. It publishes on 127.0.0.1:8006 and serves "/" of the hostname;
  # Apache path-routes /login/, /console/, /api/ and friends to `web`.
  # See infrastructure/apache/nsr-sris-dev.conf, including the note on
  # what sharing one origin costs against LP-O-10.
  #
  # No web-entrypoint.sh here: `web` owns migrate + collectstatic, and two
  # containers racing migrations on one deploy is exactly the failure that
  # entrypoint comment warns about.
  public:
    image: *app_image
    restart: unless-stopped
    env_file: [.env]
    environment:
      ROOT_URLCONF: nsr_mis.urls_public
      # Figures stay OFF until the DPO signs the §8.3 disclosure floor
      # (LP-O-06). With this false the page renders its placeholder slots.
      # Do not flip it in compose — set it in .env when sign-off lands, so
      # the change is a deliberate act with an owner.
      NSR_PUBLIC_STATS_LIVE: ${NSR_PUBLIC_STATS_LIVE:-False}
      # Same hostname now: Apache path-routes /login/ to the registry
      # container, so a relative link is correct and survives a rename.
      NSR_STAFF_SIGNIN_URL: ${NSR_STAFF_SIGNIN_URL:-/login/}
    command:
      - gunicorn
      - nsr_mis.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "127.0.0.1:8006:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_healthy}   # web migrates first

  worker:
    image: *app_image
    restart: unless-stopped
    env_file: [.env]
    command: ["celery", "-A", "nsr_mis", "worker", "-l", "info", "--concurrency=4"]
    volumes:
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_healthy}   # web runs migrate once, first

  beat:
    image: *app_image
    restart: unless-stopped
    env_file: [.env]
    command: ["celery", "-A", "nsr_mis", "beat", "-l", "info"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  media_data:
